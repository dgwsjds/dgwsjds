<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康证明查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  color: #333;
}
.nav-bar {
  background: #f5f5f5;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e8e8e8;
}
.nav-close { font-size: 28px; color: #333; width: 32px; }
.nav-title { text-align: center; flex: 1; }
.nav-title .main { font-size: 20px; font-weight: bold; color: #222; }
.nav-title .sub { font-size: 14px; color: #999; margin-top: 2px; }
.nav-more { font-size: 24px; color: #333; width: 32px; text-align: right; letter-spacing: 2px; }

.header {
  background: linear-gradient(180deg, #5ba3e8 0%, #7cb8f0 60%, #a8d4f5 100%);
  position: relative;
  padding: 50px 20px 60px 20px;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 35%);
  pointer-events: none;
}
.watermark-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.18;
  pointer-events: none;
}
.watermark-pattern svg { width: 280px; height: 280px; }
.header-title {
  text-align: center;
  color: #fff;
  font-size: 44px;
  font-weight: 900;
  -webkit-text-stroke: 1px rgba(255,255,255,0.3);
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  letter-spacing: 4px;
  position: relative;
  z-index: 2;
  margin-bottom: 30px;
}
.clouds {
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 50px;
  z-index: 1;
}
.clouds svg { width: 100%; height: 100%; display: block; }

.header-person {
  position: absolute;
  right: 20px;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 3;
}
.person-photo {
  width: 110px;
  height: 140px;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  background: #e8f0fe;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.person-photo:active { transform: scale(0.96); }
.person-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.person-photo-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: #999; font-size: 13px;
}
.person-name {
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  margin-top: 8px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.content { padding: 0 16px; margin-top: -30px; position: relative; z-index: 5; }

.card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card-header {
  background: #5ba3e8;
  padding: 16px 20px;
  display: flex;
  align-items: center;
}
.card-header .label {
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  margin-right: 8px;
}
.card-header .value {
  color: #fff;
  font-size: 22px;
  font-weight: bold;
}
.card-row {
  padding: 16px 20px;
  border-bottom: 1px solid #f0f0f0;
  display: flex;
  align-items: center;
}
.card-row:last-child { border-bottom: none; }
.card-row .label {
  font-size: 22px;
  color: #555;
  font-weight: bold;
  min-width: 110px;
}
.card-row .value {
  font-size: 22px;
  color: #444;
  flex: 1;
}

.download-section {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 30px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.download-tip {
  font-size: 18px;
  color: #666;
  margin-bottom: 14px;
  line-height: 1.5;
}
.download-input-row {
  display: flex;
  gap: 10px;
}
.download-input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 17px;
  font-family: inherit;
  color: #999;
}
.download-btn {
  padding: 12px 24px;
  background: #67c23a;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}
.footer {
  text-align: center;
  padding: 20px;
  color: #bbb;
  font-size: 13px;
}

/* ===== 照片查看器 ===== */
.photo-viewer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: none;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 30px 0;
}
.photo-viewer.active { display: block; }
.photo-viewer-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  opacity: 0;
  transition: opacity 0.35s ease;
  z-index: 0;
}
.photo-viewer.active .photo-viewer-bg { opacity: 0.95; }
.photo-viewer-img {
  display: block;
  position: relative;
  z-index: 1;
  width: 92%;
  max-width: 500px;
  height: auto;
  margin: 0 auto;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  user-select: none;
  -webkit-user-drag: none;
}
.photo-viewer.active .photo-viewer-img {
  opacity: 1;
  transform: translateY(0);
}
.photo-viewer-close-hint {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  z-index: 2;
  background: rgba(0,0,0,0.5);
  padding: 6px 16px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.photo-viewer.active .photo-viewer-close-hint { opacity: 1; }
.download-cert {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 800px;
  background: #fff;
  font-family: "SimSun", "宋体", "NSimSun", serif;
}
.download-cert .dc-top {
  background: #0d4f9c;
  color: #fff;
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  padding: 18px 0;
  letter-spacing: 16px;
  font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
}
.download-cert .dc-body {
  position: relative;
  padding: 35px 40px 25px 40px;
  min-height: 380px;
}
.download-cert .dc-watermark {
  position: absolute;
  right: 170px;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  opacity: 0.22;
  z-index: 1;
  pointer-events: none;
}
.download-cert .dc-watermark .wm-city { font-size: 100px; font-weight: bold; font-family: "Microsoft YaHei", sans-serif; line-height: 1; color: #5b9bd5; }
.download-cert .dc-watermark .wm-en { font-size: 30px; letter-spacing: 6px; margin-top: 6px; color: #5b9bd5; }
.download-cert .dc-watermark .wm-slogan { font-size: 22px; margin-top: 10px; letter-spacing: 4px; color: #70ad47; }
.download-cert .dc-photo {
  position: absolute;
  right: 35px;
  top: 30px;
  width: 150px;
  height: 200px;
  border: 1px solid #ccc;
  background: #f0f0f0;
  overflow: hidden;
  z-index: 2;
}
.download-cert .dc-photo img { width: 100%; height: 100%; object-fit: cover; }
.download-cert .dc-info { margin-right: 195px; position: relative; z-index: 2; }
.download-cert .dc-line {
  font-size: 26px;
  margin-bottom: 20px;
  color: #222;
  font-family: "SimSun", "宋体", "NSimSun", serif;
}
.download-cert .dc-line .lbl { font-weight: normal; letter-spacing: 2px; }
.download-cert .dc-qr {
  position: absolute;
  right: 35px;
  bottom: 20px;
  width: 140px;
  height: 140px;
}
.download-cert .dc-bottom {
  background: #0d4f9c;
  height: 10px;
}
.download-loading {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  color: #fff;
  font-size: 18px;
}
.download-loading.active { display: flex; }

/* 官方风格顶部导航栏 */
.gov-nav {
  background: linear-gradient(90deg, #0d4f9c 0%, #1a6bc4 100%);
  color: #fff;
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: "Microsoft YaHei", sans-serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.gov-nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gov-nav-logo {
  width: 28px;
  height: 28px;
  background: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0d4f9c;
  font-weight: bold;
  font-size: 14px;
}
.gov-nav-title {
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
}
.gov-nav-right {
  font-size: 13px;
  opacity: 0.9;
  letter-spacing: 0.5px;
}
</style>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="gov-nav">
  <div class="gov-nav-left">
    <div class="gov-nav-logo">卫</div>
    <div class="gov-nav-title">东莞市健康证明查询系统</div>
  </div>
  <div class="gov-nav-right">dghb.dg.gov.cn</div>
</div>

<div class="header">
  <div class="watermark-pattern"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="82" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="100" y1="48" x2="100" y2="152" stroke="#fff" stroke-width="4"/><path d="M100 68 Q82 73 82 90 Q82 107 100 112 Q118 117 118 134" fill="none" stroke="#fff" stroke-width="3"/><path d="M100 88 Q118 93 118 110 Q118 127 100 132" fill="none" stroke="#fff" stroke-width="3"/><circle cx="100" cy="44" r="7" fill="#fff"/><path d="M88 44 L100 32 L112 44" fill="none" stroke="#fff" stroke-width="2"/><text x="100" y="178" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" letter-spacing="2">中国卫生监督</text></svg></div>
  <div class="header-title">健康证明结果</div>
  <div class="header-person">
    <div class="person-photo" id="personPhoto">
      <div class="person-photo-placeholder">照片</div>
    </div>
    <div class="person-name" id="personName"></div>
  </div>
  <div class="clouds">
    <svg viewBox="0 0 400 50" preserveAspectRatio="none">
      <path d="M0,50 L0,30 Q50,10 100,25 Q150,40 200,20 Q250,5 300,25 Q350,40 400,15 L400,50 Z" fill="#f5f5f5"/>
    </svg>
  </div>
</div>

<div class="content">
  <div class="card">
    <div class="card-header">
      <span class="label">姓名：</span>
      <span class="value" id="r_name"></span>
    </div>
    <div class="card-row">
      <span class="label">性别：</span>
      <span class="value" id="r_gender"></span>
    </div>
    <div class="card-row">
      <span class="label">身份证号：</span>
      <span class="value" id="r_idcard"></span>
    </div>
    <div class="card-row">
      <span class="label">从业类别：</span>
      <span class="value" id="r_category"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="label">检查单位：</span>
      <span class="value" id="r_hospital"></span>
    </div>
    <div class="card-row">
      <span class="label">体检日期：</span>
      <span class="value" id="r_examDate"></span>
    </div>
    <div class="card-row">
      <span class="label">有效期至：</span>
      <span class="value" id="r_validDate"></span>
    </div>
  </div>

  <div class="download-section">
    <div class="download-tip">输入预留手机号码可下载健康证明图片：</div>
    <div class="download-input-row">
      <input type="tel" class="download-input" placeholder="请输入您的手机号码">
      <button class="download-btn">下载</button>
    </div>
  </div>
</div>

<div class="footer">健康证明查询系统</div>

<!-- 隐藏的健康证明卡片（用于生成下载图片） -->
<div class="download-cert" id="downloadCert">
  <div class="dc-top">健康证明</div>
  <div class="dc-body">
    <div class="dc-watermark">
      <div class="wm-city">东莞</div>
      <div class="wm-en">Dongguan</div>
      <div class="wm-slogan">每天绽放新精彩</div>
    </div>
    <div class="dc-photo" id="dcPhoto"></div>
    <div class="dc-info">
      <div class="dc-line"><span class="lbl">姓　名：</span><span id="dcName"></span></div>
      <div class="dc-line"><span class="lbl">性　别：</span><span id="dcGender"></span></div>
      <div class="dc-line"><span class="lbl">证件号码：</span><span id="dcIdcard"></span></div>
      <div class="dc-line"><span class="lbl">从业类别：</span><span id="dcCategory"></span></div>
      <div class="dc-line"><span class="lbl">体检单位：</span><span id="dcHospital"></span></div>
      <div class="dc-line"><span class="lbl">体检日期：</span><span id="dcExamDate"></span></div>
      <div class="dc-line"><span class="lbl">有 效 期：</span><span id="dcValidDate"></span></div>
    </div>
    <div class="dc-qr" id="dcQr"></div>
  </div>
  <div class="dc-bottom"></div>
</div>

<div class="download-loading" id="downloadLoading">正在生成图片...</div>

<!-- 照片查看器 -->
<div class="photo-viewer" id="photoViewer">
  <div class="photo-viewer-bg" id="viewerBg"></div>
  <div class="photo-viewer-close-hint">点击任意处关闭</div>
  <img class="photo-viewer-img" id="photoViewerImg" src="" alt="">
</div>

<script>
function maskIdCard(id) {
  if (!id || id.length < 8) return id || '';
  return id.substring(0, 3) + '*'.repeat(id.length - 7) + id.substring(id.length - 4);
}

function b64decode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}

/* ===== 照片查看器逻辑 ===== */
(function() {
  const viewer = document.getElementById('photoViewer');
  const viewerImg = document.getElementById('photoViewerImg');
  const viewerBg = document.getElementById('viewerBg');
  const personPhoto = document.getElementById('personPhoto');

  function openViewer(src) {
    viewerImg.src = src;
    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
    viewer.scrollTop = 0;
  }

  function closeViewer() {
    viewer.classList.remove('active');
    document.body.style.overflow = '';
  }

  // 点击照片打开
  personPhoto.addEventListener('click', function() {
    const img = personPhoto.querySelector('img');
    if (!img) return;
    openViewer(img.src);
  });

  // 点击任意处关闭
  viewer.addEventListener('click', function(e) {
    closeViewer();
  });

  // 阻止图片点击冒泡（但现在点击图片也关闭，所以不需要阻止）
})();

/* ===== 数据渲染 ===== */
window.currentCert = null;
(function() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  if (!d) return;
  try {
    const str = b64decode(d);
    const fields = str.split('|');
    const cert = {
      name: fields[0] || '',
      gender: fields[1] || '',
      idcard: fields[2] || '',
      category: fields[3] || '',
      hospital: fields[4] || '',
      examDate: fields[5] || '',
      validDate: fields[6] || '',
      photo: fields[7] || '',
      phone: fields[8] || ''
    };
    window.currentCert = cert;
    document.getElementById('personName').textContent = cert.name || '';
    document.getElementById('r_name').textContent = cert.name || '';
    document.getElementById('r_gender').textContent = cert.gender || '';
    document.getElementById('r_idcard').textContent = maskIdCard(cert.idcard);
    document.getElementById('r_category').textContent = cert.category || '';
    document.getElementById('r_hospital').textContent = cert.hospital || '';
    document.getElementById('r_examDate').textContent = cert.examDate || '';
    document.getElementById('r_validDate').textContent = cert.validDate || '';
    if (cert.photo) {
      let imgSrc = cert.photo;
      // 如果是纯base64（不是http也不是data:），补前缀
      if (imgSrc.indexOf('http') !== 0 && imgSrc.indexOf('data:') !== 0) {
        imgSrc = 'data:image/jpeg;base64,' + imgSrc;
      }
      document.getElementById('personPhoto').innerHTML = '<img src="' + imgSrc + '" alt="照片">';
    }
  } catch(e) {
    console.error('解析数据失败', e);
  }
})();

/* ===== 下载健康证明图片 ===== */
document.querySelector('.download-btn').addEventListener('click', async function() {
  const phoneInput = document.querySelector('.download-input');
  const phone = phoneInput.value.trim();
  if (!/^1\d{10}$/.test(phone)) {
    alert('请输入正确的11位手机号码');
    phoneInput.focus();
    return;
  }
  const cert = window.currentCert;
  if (!cert) {
    alert('数据加载失败，请刷新页面重试');
    return;
  }
  // 验证预留手机号
  if (cert.phone && phone !== cert.phone) {
    alert('手机号与预留号码不符，无法下载');
    phoneInput.focus();
    return;
  }
  const loading = document.getElementById('downloadLoading');
  loading.classList.add('active');
  try {
    // 填充隐藏卡片
    document.getElementById('dcName').textContent = cert.name || '';
    document.getElementById('dcGender').textContent = cert.gender || '';
    document.getElementById('dcIdcard').textContent = cert.idcard || '';
    document.getElementById('dcCategory').textContent = cert.category || '';
    document.getElementById('dcHospital').textContent = cert.hospital || '';
    document.getElementById('dcExamDate').textContent = cert.examDate || '';
    document.getElementById('dcValidDate').textContent = '至' + (cert.validDate || '');
    // 照片
    const dcPhoto = document.getElementById('dcPhoto');
    if (cert.photo) {
      let imgSrc = cert.photo;
      if (imgSrc.indexOf('http') !== 0 && imgSrc.indexOf('data:') !== 0) {
        imgSrc = 'data:image/jpeg;base64,' + imgSrc;
      }
      dcPhoto.innerHTML = '<img src="' + imgSrc + '" crossorigin="anonymous">';
    } else {
      dcPhoto.innerHTML = '';
    }
    // 生成二维码（指向当前查询页）
    const dcQr = document.getElementById('dcQr');
    dcQr.innerHTML = '';
    const qrUrl = window.location.origin + window.location.pathname + window.location.search;
    if (window.QRCode) {
      new QRCode(dcQr, { text: qrUrl, width: 110, height: 110, correctLevel: QRCode.CorrectLevel.L });
    }
    // 等待二维码和图片渲染
    await new Promise(r => setTimeout(r, 500));
    // 生成图片
    const canvas = await html2canvas(document.getElementById('downloadCert'), {
      scale: 4, useCORS: true, backgroundColor: '#ffffff', logging: false
    });
    const link = document.createElement('a');
    link.download = '健康证明_' + (cert.name || '') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err) {
    alert('生成失败: ' + err.message);
  }
  loading.classList.remove('active');
});
</script>
</body>
</html>
